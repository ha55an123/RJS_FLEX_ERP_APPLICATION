server {
    listen 80;

    # ── Backend API proxy ─────────────────────────────────────────────────────
    # All backend endpoints have a trailing slash or sub-path.
    # Using regex to match only paths that have content after the prefix,
    # so /users (frontend page) is NOT caught but /users/ (API) IS caught.

    location ~ ^/auth(/.*)?$ {
        proxy_pass http://erp-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location ~ ^/users/(.*)$ {
        proxy_pass http://erp-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location ~ ^/employees/(.*)$ {
        proxy_pass http://erp-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location ~ ^/dashboard/(.*)$ {
